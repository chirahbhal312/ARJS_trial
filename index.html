<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js NFT Marker Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      .arjs-loader {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: black;
        opacity: 0.8;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 1.5em;
      }
    </style>
  </head>

  <body>
    <div class="arjs-loader">
      Loading marker... Please wait.
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-nft
        type="nft"
        url="./assets/mymarker/mymarker"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <!-- OPTION 1: Load a 3D model -->
        <!-- <a-entity
          gltf-model="./assets/mymarker/scene.gltf"
          scale="5 5 5"
          position="0 0 0"
        ></a-entity> -->

        <!-- OPTION 2: Use a red cube -->
        <a-box
          color="red"
          depth="1"
          height="1"
          width="1"
          position="0 0.5 0"
        ></a-box>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
