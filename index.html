<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AR.js with Three.js - Red Cube</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }
      .arjs-loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div class="arjs-loader" id="arjs-loader">Loading, please wait...</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/three.js/build/ar-nft.min.js"></script>

    <script>
      let scene, camera, renderer;
      let clock = new THREE.Clock();
      let markerRoot, arToolkitSource, arToolkitContext;

      init();
      animate();

      function init() {
        // Scene
        scene = new THREE.Scene();

        // Camera
        camera = new THREE.Camera();
        scene.add(camera);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0px';
        renderer.domElement.style.left = '0px';
        document.body.appendChild(renderer.domElement);

        // AR Source
        arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
        arToolkitSource.init(function onReady() {
          setTimeout(() => {
            document.getElementById('arjs-loader').style.display = 'none';
          }, 1000);
          onResize();
        });

        window.addEventListener('resize', () => onResize());

        // AR Context
        arToolkitContext = new THREEx.ArToolkitContext({
          cameraParametersUrl:
            'https://raw.githack.com/AR-js-org/AR.js/master/three.js/data/camera_para.dat',
          detectionMode: 'mono_and_matrix',
        });

        arToolkitContext.init(() => {
          camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
        });

        // Marker Root
        markerRoot = new THREE.Group();
        scene.add(markerRoot);

        const markerControls = new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
          type: 'nft',
          descriptorsUrl:
            'https://raw.githubusercontent.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex-image-big.jpeg',
        });

        // Red Cube
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.y = 0.5;
        markerRoot.add(cube);
      }

      function onResize() {
        arToolkitSource.onResizeElement();
        arToolkitSource.copyElementSizeTo(renderer.domElement);
        if (arToolkitContext.arController) {
          arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        if (arToolkitSource.ready) {
          arToolkitContext.update(arToolkitSource.domElement);
        }
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
